<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | HerGlow</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white">
        <div class="container">

            <a class="navbar-brand" href="index.html">
                HerGlow
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto align-items-lg-center">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="skinsense.html">
                            SkinSense
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="hervault.html">
                            HerVault
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="hercycle.html">
                            HerCycle
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="myglow.html">
                            MyGlow
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="selfcare.html">
                            Self-Care
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="register.html">
                            Register
                        </a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>


    <!-- Login Section -->
    <section class="py-5">

        <div class="container">

            <div class="text-center mb-5">

                <p class="eyebrow">
                    WELCOME BACK
                </p>

                <h1 class="section-title">
                    Login to HerGlow
                </h1>

                <p class="section-subtitle">
                    Continue your journey toward a healthier, happier glow.
                </p>

            </div>


            <div class="row justify-content-center">

                <div class="col-md-7 col-lg-5">

                    <div class="p-4 p-md-5 bg-white rounded-4 shadow-sm">

                        <form id="loginForm">

                            <!-- Email -->

                            <div class="mb-3">

                                <label
                                    for="loginEmail"
                                    class="form-label">

                                    Email

                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="loginEmail"
                                    placeholder="Enter your email"
                                    required>

                            </div>


                            <!-- Password -->

                            <div class="mb-4">

                                <label
                                    for="loginPassword"
                                    class="form-label">

                                    Password

                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="loginPassword"
                                    placeholder="Enter your password"
                                    required>

                            </div>


                            <!-- Login Button -->

                            <button
                                type="submit"
                                class="btn btn-herglow w-100">

                                Login

                            </button>

                        </form>


                        <!-- Message -->

                        <div
                            id="loginMessage"
                            class="mt-3 text-center">
                        </div>


                        <!-- Register Link -->

                        <p class="text-center mt-4 mb-0">

                            Don't have an account?

                            <a href="register.html">
                                Create one
                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- Footer -->

    <footer class="footer-section">

        <div class="container text-center">

            <p>
                © 2026 HerGlow. Your health. Your beauty. Your glow.
            </p>

        </div>

    </footer>


    <!-- Bootstrap -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- HerGlow Authentication -->

    <script src="js/auth.js"></script>

</body>
</html>
